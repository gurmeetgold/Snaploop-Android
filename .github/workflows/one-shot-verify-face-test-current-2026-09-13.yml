name: Verify current Face Setup test fixes 2026-09-13
on:
  push:
    branches: [fix/device-acceptance-p0-2026-09-11]
    paths:
      - '.github/workflows/one-shot-verify-face-test-current-2026-09-13.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/device-acceptance-p0-2026-09-11
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.6.0' }
      - name: Verify Face Setup test contracts
        run: |
          grep -q 'pipeline.detectFaces(jpeg)' app/src/main/java/com/snaploop/app/ui/FaceSetupParityActions.kt
          grep -q 'decodeExifOrientedBitmap' app/src/main/java/com/snaploop/app/ui/ParityFaceSetupScreen.kt
          grep -q 'Choose any normal photo' app/src/main/java/com/snaploop/app/ui/ParityFaceSetupScreen.kt
      - name: Unit tests lint and debug compile
        run: gradle test lint assembleDebug
