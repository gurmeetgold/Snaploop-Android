name: Repair Compose compile
on:
  push:
    branches: [feature/android-production-parity-v1]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/android-production-parity-v1
      - name: Apply isolated compile repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          coordinator = Path('app/src/main/java/com/snaploop/app/ui/AppCoordinator.kt')
          text = coordinator.read_text()
          text = text.replace('private val events = FirebaseEventRepository()', 'private val eventRepository = FirebaseEventRepository()')
          replacements = {
              'events.eventsForUser': 'eventRepository.eventsForUser',
              'events.createEvent': 'eventRepository.createEvent',
              'events.fetchEvent': 'eventRepository.fetchEvent',
              'events.resolveJoinCode': 'eventRepository.resolveJoinCode',
              'events.join': 'eventRepository.join',
              'events.setSharing': 'eventRepository.setSharing',
              'events.leave': 'eventRepository.leave',
              'events.members': 'eventRepository.members',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          coordinator.write_text(text)

          ui = Path('app/src/main/java/com/snaploop/app/ui/SnapLoopApp.kt')
          text = ui.read_text().replace('import androidx.compose.foundation.layout.weight\n', '')
          ui.write_text(text)
          PY

          if git diff --quiet; then
            echo 'No repair required.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/snaploop/app/ui/AppCoordinator.kt app/src/main/java/com/snaploop/app/ui/SnapLoopApp.kt
          git commit -m 'fix: resolve Compose flow compilation'
          git push origin HEAD:feature/android-production-parity-v1
