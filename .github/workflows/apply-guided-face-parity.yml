name: Apply Guided Face Parity

on:
  push:
    branches:
      - feature/android-production-parity-v1
    paths:
      - .github/workflows/apply-guided-face-parity.yml
      - scripts/apply-guided-face-parity.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/android-production-parity-v1
          fetch-depth: 0
      - name: Apply migration
        run: python3 scripts/apply-guided-face-parity.py
      - name: Commit migration
        run: |
          if git diff --quiet; then
            echo "No migration changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/snaploop/app/ui/SnapLoopApp.kt app/src/main/java/com/snaploop/app/ui/GuidedFaceEnrollmentCamera.kt
          git commit -m "fix: harden guided auto face scan"
          git push origin HEAD:feature/android-production-parity-v1
