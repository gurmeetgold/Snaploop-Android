name: One-shot device acceptance batch

on:
  push:
    branches:
      - 'fix/device-acceptance-batch-2026-09-10-impl'
    paths:
      - '.github/workflows/one-shot-device-acceptance-batch.yml'

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Apply guarded device acceptance fixes
        run: python3 scripts/device_acceptance_batch_fix.py
      - name: Update superseded Face Setup regression assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/test/java/com/snaploop/app/ui/FaceSetupReturnNavigationParityTest.kt')
          s = p.read_text()
          old = 'assertTrue(source.contains("scanOpen = false\\n                onComplete()"))'
          new = 'assertTrue(source.contains("scanOpen = false\\n                finishingSetup = true\\n                onComplete()"))'
          if s.count(old) != 1:
              raise SystemExit('expected one legacy Face Setup assertion')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Verify diff
        run: git diff --check
      - name: Run full Android verification
        run: gradle test lint assembleDebug assembleRelease assembleDebugAndroidTest
      - name: Commit verified implementation
        run: |
          git config user.name "gurmeetgold"
          git config user.email "50425243+gurmeetgold@users.noreply.github.com"
          git add app/src/main app/src/test
          git diff --cached --check
          git commit -m "Fix device acceptance parity and consent enforcement"
          git push origin HEAD:fix/device-acceptance-batch-2026-09-10-impl

# Retry 4: update the old camera-close regression for the new explicit processing state.
