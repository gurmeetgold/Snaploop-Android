name: One-shot device acceptance P0

on:
  push:
    branches:
      - 'fix/device-acceptance-p0-2026-09-11'
    paths:
      - '.github/workflows/one-shot-device-acceptance-p0.yml'

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Apply device acceptance P0 batch
        run: python3 scripts/device_acceptance_p0_batch.py
      - name: Verify diff
        run: git diff --check
      - name: Run full Android verification
        run: gradle test lint assembleDebug assembleRelease assembleDebugAndroidTest
      - name: Commit verified implementation
        run: |
          git config user.name "gurmeetgold"
          git config user.email "50425243+gurmeetgold@users.noreply.github.com"
          git add app/src/main app/src/test
          git diff --cached --check
          git commit -m "Fix device acceptance P0 runtime and compact parity"
          git push origin HEAD:fix/device-acceptance-p0-2026-09-11
