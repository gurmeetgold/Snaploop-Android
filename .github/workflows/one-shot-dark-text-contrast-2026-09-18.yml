name: One-shot dark text contrast 2026-09-18

on:
  workflow_dispatch:
  push:
    branches:
      - fix/device-acceptance-p0-2026-09-11
    paths:
      - ".github/workflows/one-shot-dark-text-contrast-2026-09-18.yml"

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/device-acceptance-p0-2026-09-11
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Apply comprehensive dark-mode text contrast fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path("app/src/main/java/com/snaploop/app/ui")
          theme = root / "SnapLoopTheme.kt"
          src = theme.read_text()

          src = src.replace(
              "            onBackground = SnapColors.DarkInk,\n"
              "            onSurface = SnapColors.DarkInk,\n"
              "            onSurfaceVariant = Color(0xFFC9C6D1),",
              "            onBackground = Color.White,\n"
              "            onSurface = Color.White,\n"
              "            onSurfaceVariant = Color.White,"
          )

          marker = "internal const val APP_FONT_SCALE_MULTIPLIER = 0.96f"
          helper = """internal fun resolveSnapTextColor(isDark: Boolean, lightColor: Color): Color =
              if (isDark) Color.White else lightColor

          @Composable
          internal fun snapReadableTextColor(lightColor: Color): Color =
              resolveSnapTextColor(isSystemInDarkTheme(), lightColor)

          """
          if "fun snapReadableTextColor" not in src:
              src = src.replace(marker, helper + marker)
          theme.write_text(src)

          def skip_string(text, i):
              if text.startswith('"""', i):
                  j = text.find('"""', i + 3)
                  return len(text) if j < 0 else j + 3
              quote = text[i]
              j = i + 1
              escaped = False
              while j < len(text):
                  ch = text[j]
                  if escaped:
                      escaped = False
                  elif ch == "\\":
                      escaped = True
                  elif ch == quote:
                      return j + 1
                  j += 1
              return len(text)

          def matching_paren(text, open_i):
              depth = 0
              i = open_i
              while i < len(text):
                  if text.startswith("//", i):
                      j = text.find("\n", i + 2)
                      i = len(text) if j < 0 else j + 1
                      continue
                  if text.startswith("/*", i):
                      j = text.find("*/", i + 2)
                      i = len(text) if j < 0 else j + 2
                      continue
                  if text[i] in ('"', "'"):
                      i = skip_string(text, i)
                      continue
                  if text[i] == "(":
                      depth += 1
                  elif text[i] == ")":
                      depth -= 1
                      if depth == 0:
                          return i
                  i += 1
              raise RuntimeError(f"Unbalanced Text call near {open_i}")

          def expression_end(call, start):
              par = br = brace = 0
              i = start
              while i < len(call):
                  if call.startswith("//", i):
                      j = call.find("\n", i + 2)
                      i = len(call) if j < 0 else j + 1
                      continue
                  if call.startswith("/*", i):
                      j = call.find("*/", i + 2)
                      i = len(call) if j < 0 else j + 2
                      continue
                  if call[i] in ('"', "'"):
                      i = skip_string(call, i)
                      continue
                  ch = call[i]
                  if ch == "(":
                      par += 1
                  elif ch == ")":
                      if par == 0:
                          return i
                      par -= 1
                  elif ch == "[":
                      br += 1
                  elif ch == "]":
                      br -= 1
                  elif ch == "{":
                      brace += 1
                  elif ch == "}":
                      brace -= 1
                  elif ch == "," and par == 0 and br == 0 and brace == 0:
                      return i
                  i += 1
              return len(call)

          def wrap_text_colors(text):
              positions = []
              i = 0
              while True:
                  idx = text.find("Text(", i)
                  if idx < 0:
                      break
                  before = text[idx - 1] if idx > 0 else " "
                  if before.isalnum() or before == "_":
                      i = idx + 5
                      continue
                  open_i = idx + 4
                  close_i = matching_paren(text, open_i)
                  positions.append((idx, close_i + 1))
                  i = close_i + 1

              for start, end in reversed(positions):
                  call = text[start:end]
                  replacements = []
                  cursor = 0
                  while True:
                      cidx = call.find("color", cursor)
                      if cidx < 0:
                          break
                      before = call[cidx - 1] if cidx > 0 else " "
                      after_i = cidx + 5
                      after = call[after_i] if after_i < len(call) else " "
                      if before.isalnum() or before == "_" or after.isalnum() or after == "_":
                          cursor = after_i
                          continue
                      j = after_i
                      while j < len(call) and call[j].isspace():
                          j += 1
                      if j >= len(call) or call[j] != "=":
                          cursor = after_i
                          continue
                      expr_start = j + 1
                      while expr_start < len(call) and call[expr_start].isspace():
                          expr_start += 1
                      expr_end = expression_end(call, expr_start)
                      expr = call[expr_start:expr_end].rstrip()
                      if expr and not expr.startswith("snapReadableTextColor("):
                          replacements.append((expr_start, expr_start + len(expr), f"snapReadableTextColor({expr})"))
                      cursor = max(expr_end + 1, after_i)

                  for a, b, repl in reversed(replacements):
                      call = call[:a] + repl + call[b:]
                  text = text[:start] + call + text[end:]
              return text

          changed = []
          for path in sorted(root.glob("*.kt")):
              old = path.read_text()
              new = wrap_text_colors(old)
              if new != old:
                  path.write_text(new)
                  changed.append(str(path))

          test = Path("app/src/test/java/com/snaploop/app/ui/DarkModeTextContrastRegressionTest.kt")
          test.write_text("""package com.snaploop.app.ui

          import androidx.compose.ui.graphics.Color
          import org.junit.Assert.assertEquals
          import org.junit.Test

          class DarkModeTextContrastRegressionTest {
              @Test
              fun `dark mode always resolves readable text to pure white`() {
                  assertEquals(Color.White, resolveSnapTextColor(true, SnapColors.Ink))
                  assertEquals(Color.White, resolveSnapTextColor(true, SnapColors.Secondary))
                  assertEquals(Color.White, resolveSnapTextColor(true, SnapColors.Coral))
                  assertEquals(Color.White, resolveSnapTextColor(true, Color.Red))
              }

              @Test
              fun `light mode preserves the exact requested text color`() {
                  val samples = listOf(
                      SnapColors.Ink,
                      SnapColors.Secondary,
                      SnapColors.Coral,
                      SnapColors.Lilac,
                      Color.Red,
                      Color(0xFF66636C),
                  )
                  samples.forEach { color ->
                      assertEquals(color, resolveSnapTextColor(false, color))
                  }
              }
          }
          """)

          print("Updated explicit Text colors in:")
          for path in changed:
              print(path)
          PY

      - name: Verify dark-mode resolver coverage
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          theme = Path("app/src/main/java/com/snaploop/app/ui/SnapLoopTheme.kt").read_text()
          required = [
              "onBackground = Color.White",
              "onSurface = Color.White",
              "onSurfaceVariant = Color.White",
              "fun snapReadableTextColor",
              "if (isDark) Color.White else lightColor",
          ]
          missing = [item for item in required if item not in theme]
          if missing:
              raise SystemExit("Missing dark-mode text guarantees: " + ", ".join(missing))

          ui = Path("app/src/main/java/com/snaploop/app/ui")
          explicit = 0
          wrapped = 0
          for path in ui.glob("*.kt"):
              text = path.read_text()
              explicit += text.count("color =")
              wrapped += text.count("snapReadableTextColor(")
          print(f"Explicit color assignments: {explicit}")
          print(f"Dark-mode text wrappers: {wrapped}")
          if wrapped < 40:
              raise SystemExit("Expected broad Text color coverage but wrapper count is unexpectedly low")
          PY

      - name: Run unit tests lint and compile
        run: gradle test lint assembleDebug

      - name: Commit verified fix
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-dark-text-contrast-2026-09-18.yml
          git config user.name "gurmeetgold"
          git config user.email "50425243+gurmeetgold@users.noreply.github.com"
          git add -A
          git commit -m "Make dark-mode text consistently white"
          git push origin HEAD:fix/device-acceptance-p0-2026-09-11
