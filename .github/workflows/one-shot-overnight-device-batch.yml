name: One-shot overnight device batch

on:
  push:
    branches:
      - 'fix/overnight-device-batch-2026-09-10'
    paths:
      - '.github/workflows/one-shot-overnight-device-batch.yml'

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Apply manual scan race follow-up
        run: python3 scripts/overnight_scan_race_followup.py
      - name: Verify diff
        run: git diff --check
      - name: Run full Android verification
        run: gradle test lint assembleDebug assembleRelease assembleDebugAndroidTest
      - name: Commit verified implementation
        run: |
          git config user.name "gurmeetgold"
          git config user.email "50425243+gurmeetgold@users.noreply.github.com"
          git add app/src/main app/src/test
          git diff --cached --check
          git commit -m "Prevent automatic scan race and speed gallery previews"
          git push origin HEAD:fix/overnight-device-batch-2026-09-10
