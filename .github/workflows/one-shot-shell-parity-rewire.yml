name: One-shot reported category icon parity batch

on:
  push:
    branches:
      - 'feature/android-production-parity-v1'
    paths:
      - '.github/workflows/one-shot-shell-parity-rewire.yml'

permissions:
  contents: write

jobs:
  rewire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guarded category icon parity fixes
        run: python3 scripts/one_shot_rewire_shell_parity.py
      - name: Commit guarded category icon parity fixes
        run: |
          git config user.name "gurmeetgold"
          git config user.email "50425243+gurmeetgold@users.noreply.github.com"
          git add \
            app/src/main/java/com/snaploop/app/ui/SnapLoopMainShell.kt \
            app/src/main/java/com/snaploop/app/ui/ParityEventDashboard.kt \
            app/src/test/java/com/snaploop/app/ui/ReportedCategoryIconParityTest.kt
          git diff --cached --check
          git commit -m "Match Home and Event category icons"
          git push origin HEAD:feature/android-production-parity-v1
