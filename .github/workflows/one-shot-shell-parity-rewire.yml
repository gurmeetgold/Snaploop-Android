name: One-shot Create Edit You visual parity batch

on:
  push:
    branches:
      - 'feature/android-production-parity-v1'
    paths:
      - '.github/workflows/one-shot-shell-parity-rewire.yml'

permissions:
  contents: write

jobs:
  rewire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guarded Create Edit and You parity fixes
        run: python3 scripts/one_shot_rewire_shell_parity.py
      - name: Commit guarded Create Edit and You parity fixes
        run: |
          git config user.name "gurmeetgold"
          git config user.email "50425243+gurmeetgold@users.noreply.github.com"
          git add \
            app/src/main/java/com/snaploop/app/ui/ParityCreateEventDialog.kt \
            app/src/main/java/com/snaploop/app/ui/ParityEditEventDialog.kt \
            app/src/main/java/com/snaploop/app/ui/ParityYouScreen.kt \
            app/src/test/java/com/snaploop/app/ui/CreateEditYouVisualParityTest.kt
          git diff --cached --check
          git commit -m "Align Create Edit and You visual semantics"
          git push origin HEAD:feature/android-production-parity-v1
