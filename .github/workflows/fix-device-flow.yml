name: Fix Android device flow

on:
  push:
    branches:
      - feature/android-production-parity-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/android-production-parity-v1
      - name: Apply device-flow patch
        run: python3 scripts/patch-device-flow.py
      - name: Fix nullable capture bytes
        run: python3 -c 'from pathlib import Path; p=Path("app/src/main/java/com/snaploop/app/ui/SnapLoopApp.kt"); s=p.read_text(); p.write_text(s.replace("if (!jpeg.isNullOrEmpty()) onCapture(jpeg)", "if (jpeg != null && jpeg.isNotEmpty()) onCapture(jpeg)"))'
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No device-flow patch required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/snaploop/app/ui/AppCoordinator.kt
          git add app/src/main/java/com/snaploop/app/ui/SnapLoopApp.kt
          git add app/src/main/AndroidManifest.xml
          git add app/src/main/res/xml/file_paths.xml
          git commit -m "fix: compile full-resolution face capture"
          git push origin HEAD:feature/android-production-parity-v1
