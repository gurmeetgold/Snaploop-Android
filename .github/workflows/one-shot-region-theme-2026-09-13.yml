name: One-shot region and theme verification 2026-09-13
on:
  push:
    branches: [fix/device-acceptance-p0-2026-09-11]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.6.0' }
      - name: Unit tests lint and debug compile
        run: gradle testDebugUnitTest lintDebug assembleDebug
