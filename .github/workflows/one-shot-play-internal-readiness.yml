name: One-shot Play internal readiness

on:
  push:
    branches:
      - 'fix/device-acceptance-p0-2026-09-11'
    paths:
      - '.github/workflows/one-shot-play-internal-readiness.yml'

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Apply Play internal release readiness patch
        run: python3 scripts/play_internal_release_readiness.py
      - name: Verify diff
        run: git diff --check
      - name: Run Android verification
        run: gradle test lint assembleDebug assembleDebugAndroidTest
      - name: Commit verified implementation
        run: |
          git config user.name "gurmeetgold"
          git config user.email "50425243+gurmeetgold@users.noreply.github.com"
          git add app/build.gradle.kts app/src/main app/src/test
          git diff --cached --check
          git commit -m "Prepare SnapLoop for Play internal testing"
          git push origin HEAD:fix/device-acceptance-p0-2026-09-11
