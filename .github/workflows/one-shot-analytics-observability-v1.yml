name: One-shot analytics observability v1
on:
  push:
    branches: [feature/analytics-observability-v1]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile unit tests and lint
        run: gradle testDebugUnitTest lintDebug --stacktrace
