name: One-shot Gallery padding compile fix

on:
  push:
    branches:
      - 'feature/android-production-parity-v1'
    paths:
      - '.github/workflows/one-shot-gallery-padding-compile-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guarded padding fix
        run: python3 scripts/fix_gallery_padding_compile.py
      - name: Commit compile fix
        run: |
          git config user.name "gurmeetgold"
          git config user.email "50425243+gurmeetgold@users.noreply.github.com"
          git add app/src/main/java/com/snaploop/app/ui/ParityPhotoGallery.kt
          git diff --cached --check
          git commit -m "Fix Gallery Compose padding compilation"
          git push origin HEAD:feature/android-production-parity-v1
