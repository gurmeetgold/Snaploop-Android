name: One-time UI Regression Patch
on:
  push:
    branches: [feature/android-production-parity-v1]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/android-production-parity-v1
      - name: Apply targeted source patch
        run: python3 scripts/apply_ui_regression_patch.py
      - name: Commit patched sources
        run: |
          if git diff --quiet; then
            echo "No patch changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/snaploop/app/ui/SnapLoopMainShell.kt app/src/main/java/com/snaploop/app/ui/SnapLoopApp.kt
          git commit -m "fix: resolve scan, gallery and You regressions"
          git push origin HEAD:feature/android-production-parity-v1
