name: One-shot light-surface contrast 2026-09-18

on:
  push:
    branches:
      - fix/device-acceptance-p0-2026-09-11
    paths:
      - ".github/workflows/one-shot-light-surface-contrast-2026-09-18.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/device-acceptance-p0-2026-09-11
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Apply contrast-safe dark mode surfaces
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path("app/src/main/java/com/snaploop/app/ui")

          theme = root / "SnapLoopTheme.kt"
          text = theme.read_text()
          marker = """@Composable
internal fun snapReadableTextColor(lightColor: Color): Color =
    resolveSnapTextColor(isSystemInDarkTheme(), lightColor)

internal const val APP_FONT_SCALE_MULTIPLIER = 0.96f"""
          replacement = """@Composable
internal fun snapReadableTextColor(lightColor: Color): Color =
    resolveSnapTextColor(isSystemInDarkTheme(), lightColor)

/** Text drawn on an intentionally light surface remains dark in either system appearance. */
internal fun snapTextOnLightSurface(lightColor: Color = SnapColors.Ink): Color = lightColor

internal const val APP_FONT_SCALE_MULTIPLIER = 0.96f"""
          if marker not in text:
              raise SystemExit("SnapLoopTheme marker not found")
          theme.write_text(text.replace(marker, replacement))

          onboarding = root / "ParityOnboardingScreen.kt"
          text = onboarding.read_text()
          replacements = [
              (
                  "color = snapReadableTextColor(SnapColors.Ink.copy(alpha = 0.78f)),",
                  "color = snapTextOnLightSurface(SnapColors.Ink.copy(alpha = 0.78f)),",
              ),
              (
                  'Text(label, fontSize = 11.sp, fontWeight = FontWeight.Bold, maxLines = 1, modifier = Modifier.padding(top = 7.dp))',
                  'Text(label, color = snapTextOnLightSurface(), fontSize = 11.sp, fontWeight = FontWeight.Bold, maxLines = 1, modifier = Modifier.padding(top = 7.dp))',
              ),
              (
                  'Text(text, fontSize = 9.sp, fontWeight = FontWeight.Bold, color = snapReadableTextColor(SnapColors.Ink), maxLines = 1)',
                  'Text(text, fontSize = 9.sp, fontWeight = FontWeight.Bold, color = snapTextOnLightSurface(), maxLines = 1)',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"Onboarding contrast marker not found: {old}")
              text = text.replace(old, new)
          onboarding.write_text(text)

          scan = root / "ParityEventScanScreen.kt"
          text = scan.read_text()
          text = text.replace(
              'color = snapReadableTextColor(Color(0xFF6B6670)),',
              'color = snapTextOnLightSurface(SnapColors.Secondary),',
          )
          title_calls = [
              'Text("Scan stopped", fontSize = 20.sp, fontWeight = FontWeight.Bold)',
              'Text("Scan Event Photos", fontSize = 20.sp, fontWeight = FontWeight.Bold)',
          ]
          for old in title_calls:
              if old not in text:
                  raise SystemExit(f"Scan title marker not found: {old}")
              new = old[:-1] + ', color = snapTextOnLightSurface())'
              text = text.replace(old, new)
          old = '''Text(
                                if (result.checked > 0) "Scan complete" else "You're up to date",
                                fontSize = 20.sp,
                                fontWeight = FontWeight.Bold,
                            )'''
          new = '''Text(
                                if (result.checked > 0) "Scan complete" else "You're up to date",
                                color = snapTextOnLightSurface(),
                                fontSize = 20.sp,
                                fontWeight = FontWeight.Bold,
                            )'''
          if old not in text:
              raise SystemExit("Scan completion title marker not found")
          text = text.replace(old, new)
          old = '''Text(
                            if (progress.total > 0) {
                                "Scanning ${progress.checked} of ${progress.total} Event photos"
                            } else {
                                "Preparing Event photos…"
                            },
                            fontSize = 16.sp,
                            fontWeight = FontWeight.Bold,
                            textAlign = TextAlign.Center,
                        )'''
          new = '''Text(
                            if (progress.total > 0) {
                                "Scanning ${progress.checked} of ${progress.total} Event photos"
                            } else {
                                "Preparing Event photos…"
                            },
                            color = snapTextOnLightSurface(),
                            fontSize = 16.sp,
                            fontWeight = FontWeight.Bold,
                            textAlign = TextAlign.Center,
                        )'''
          if old not in text:
              raise SystemExit("Scan progress title marker not found")
          text = text.replace(old, new)
          scan.write_text(text)

          you = root / "ParityYouScreen.kt"
          text = you.read_text()
          if "import androidx.compose.ui.graphics.Brush" not in text:
              text = text.replace(
                  "import androidx.compose.ui.graphics.Color\n",
                  "import androidx.compose.ui.graphics.Brush\nimport androidx.compose.ui.graphics.Color\n",
              )
          old = """.background(SnapGradients.SoftWash)
            .verticalScroll"""
          new = """.background(
                if (MaterialTheme.colorScheme.background == SnapColors.DarkCanvas) {
                    Brush.linearGradient(listOf(SnapColors.DarkCanvas, SnapColors.DarkSubtleSurface))
                } else {
                    SnapGradients.SoftWash
                },
            )
            .verticalScroll"""
          if old not in text:
              raise SystemExit("You screen background marker not found")
          you.write_text(text.replace(old, new))

          gallery = root / "ParityPhotoGallery.kt"
          text = gallery.read_text()
          old = 'Card(shape = RoundedCornerShape(22.dp)) {'
          new = '''Card(
                    shape = RoundedCornerShape(22.dp),
                    colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface),
                ) {'''
          if old not in text:
              raise SystemExit("Gallery empty card marker not found")
          gallery.write_text(text.replace(old, new, 1))

          test = Path("app/src/test/java/com/snaploop/app/ui/DarkModeSurfaceContrastRegressionTest.kt")
          test.write_text("""package com.snaploop.app.ui

          import androidx.compose.ui.graphics.Color
          import java.nio.file.Files
          import java.nio.file.Paths
          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertFalse
          import org.junit.Assert.assertTrue
          import org.junit.Test

          class DarkModeSurfaceContrastRegressionTest {
              @Test
              fun `light surface text remains dark in either appearance`() {
                  assertEquals(SnapColors.Ink, snapTextOnLightSurface())
                  assertEquals(SnapColors.Secondary, snapTextOnLightSurface(SnapColors.Secondary))
              }

              @Test
              fun `onboarding white banners never use dark-mode white text resolver`() {
                  val source = Files.readString(Paths.get("src/main/java/com/snaploop/app/ui/ParityOnboardingScreen.kt"))
                  assertTrue(source.contains("color = snapTextOnLightSurface(SnapColors.Ink.copy(alpha = 0.78f))"))
                  assertTrue(source.contains("Text(label, color = snapTextOnLightSurface()"))
                  assertTrue(source.contains("color = snapTextOnLightSurface(), maxLines = 1"))
                  assertFalse(source.contains("color = snapReadableTextColor(SnapColors.Ink.copy(alpha = 0.78f))"))
              }

              @Test
              fun `scan light gradient uses dark text tokens`() {
                  val source = Files.readString(Paths.get("src/main/java/com/snaploop/app/ui/ParityEventScanScreen.kt"))
                  assertTrue(source.contains(".background(SnapGradients.ScanSurface)"))
                  assertTrue(source.contains("color = snapTextOnLightSurface()"))
                  assertTrue(source.contains("color = snapTextOnLightSurface(SnapColors.Secondary)"))
              }

              @Test
              fun `you and gallery use dark surfaces when system theme is dark`() {
                  val you = Files.readString(Paths.get("src/main/java/com/snaploop/app/ui/ParityYouScreen.kt"))
                  assertTrue(you.contains("Brush.linearGradient(listOf(SnapColors.DarkCanvas, SnapColors.DarkSubtleSurface))"))
                  val gallery = Files.readString(Paths.get("src/main/java/com/snaploop/app/ui/ParityPhotoGallery.kt"))
                  assertTrue(gallery.contains("CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface)"))
              }
          }
          """)

      - name: Run tests lint and debug compile
        run: gradle test lint assembleDebug

      - name: Commit verified contrast fix
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-light-surface-contrast-2026-09-18.yml
          git config user.name "gurmeetgold"
          git config user.email "50425243+gurmeetgold@users.noreply.github.com"
          git add -A
          git commit -m "Fix dark-mode contrast on light surfaces"
          git push origin HEAD:fix/device-acceptance-p0-2026-09-11
