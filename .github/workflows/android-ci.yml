name: Android CI
on:
  pull_request:
  push:
    branches: [feature/android-production-parity-v1]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.6.0' }
      - name: Verify Android build
        run: gradle test lint assembleDebug assembleDebugAndroidTest
      - name: Print lint report on failure
        if: failure()
        run: |
          REPORT="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$REPORT" ]; then
            echo "===== Android lint report ====="
            cat "$REPORT"
          fi
